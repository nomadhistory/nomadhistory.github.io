<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 42" width="360" height="42" role="img" aria-label="Historia Nomade">
  <!-- Preto puro e sem media query de propósito. Um SVG carregado
       via <img> é outro documento: ele não enxerga o tema escolhido
       na página, só o do sistema. Por isso a cor é decidida fora,
       com filter: invert(1), igual à marca — assim o botão de tema
       manda nos dois. O traço laranja do lockup é desenhado em CSS,
       que tem acesso aos tokens. -->
  <text x="0" y="30" fill="#000000"
        font-family="Iowan Old Style, Palatino, Georgia, Times New Roman, serif"
        font-size="30" letter-spacing="2.2">HISTORIA NOMADE</text>
</svg>

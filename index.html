<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">

<!-- LANÇAMENTO: remover a linha abaixo quando houver case real publicado,
     e conferir na URL de produção (não no repo):
       curl -s https://nomadhistory.github.io/ | grep robots
     tem que voltar vazio. -->
<meta name="robots" content="noindex, nofollow">

<title>Historia Nomade — Marketing studio for hotels, hostels and tourism</title>
<meta name="description" content="Brand, website, social media and channel visibility for small hospitality. We turn what makes your property different into direct bookings. Fixed scope, fixed price, from US$500.">
<link rel="canonical" href="https://nomadhistory.github.io/">

<meta property="og:type" content="website">
<meta property="og:title" content="Historia Nomade — Marketing studio for hotels, hostels and tourism">
<meta property="og:description" content="Brand, website, social media and channel visibility for small hospitality. Fixed scope, fixed price, from US$500.">
<meta property="og:url" content="https://nomadhistory.github.io/">
<meta property="og:image" content="https://nomadhistory.github.io/og-image.png">
<meta property="og:locale" content="en">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Historia Nomade — Marketing studio for hotels, hostels and tourism">
<meta name="twitter:description" content="Brand, website, social media and channel visibility for small hospitality. Fixed scope, fixed price, from US$500.">
<meta name="twitter:image" content="https://nomadhistory.github.io/og-image.png">

<meta name="theme-color" content="#14100c">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="stylesheet" href="styles-base.css">
<link rel="stylesheet" href="styles-site.css">
<link rel="stylesheet" href="styles-motion.css">

<!-- Único script no <head>: carimba o tema escolhido antes da
     primeira pintura, senão a página pisca no tema errado. -->
<script src="js/theme.js"></script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "Historia Nomade",
  "description": "Brand identity, websites, social media and channel visibility for hotels, hostels, guesthouses, restaurants and tour operators.",
  "url": "https://nomadhistory.github.io/",
  "areaServed": "Worldwide",
  "knowsLanguage": ["en", "pt"],
  "serviceType": [
    "Brand identity",
    "Website design and development",
    "Social media, photo and video",
    "Channel and search visibility"
  ],
  "audience": {
    "@type": "BusinessAudience",
    "audienceType": "Hotels, hostels, guesthouses, restaurants and tour operators"
  }
}
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- Textura de grão sobre a página inteira. Puramente decorativa. -->
<div class="grain" aria-hidden="true"></div>
<!-- Progresso de leitura, preenchido pelo js/motion.js -->
<div class="scroll-progress" aria-hidden="true"><span></span></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#top" aria-label="Historia Nomade — home">
      <img class="brand-mark" src="assets/logo-mark.png" alt="" width="512" height="521" aria-hidden="true">
      <span class="brand-word">
        <img src="assets/wordmark.svg" alt="Historia Nomade" width="360" height="42">
      </span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="#services">Services</a>
      <a href="#method">How we work</a>
      <a href="#packages">Plans</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch theme" title="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"></path>
        </svg>
      </button>
      <a class="nav-cta" href="#proposal">Get a proposal</a>
    </nav>
  </div>
</header>

<main id="main">
  <span id="top"></span>

  <section class="hero" id="hero" aria-labelledby="hero-title">
    <div class="hero-aura" aria-hidden="true"></div>
  </section>

  <section class="section" id="services" aria-labelledby="services-title"></section>

  <section class="section section-alt" id="team" aria-labelledby="team-title"></section>

  <section class="section" id="method" aria-labelledby="method-title"></section>

  <section class="section section-alt" id="cases" aria-labelledby="cases-title"></section>

  <section class="section" id="packages" aria-labelledby="packages-title"></section>

  <section class="section section-alt" id="proposal" aria-labelledby="proposal-title"></section>

  <section class="section" id="contact" aria-labelledby="contact-title"></section>
</main>

<footer class="site-footer">
  <div class="wrap" id="footer-inner"></div>
</footer>

<script src="js/content.js"></script>
<script src="js/proposal-engine.js"></script>
<script src="js/site.js"></script>
<script src="js/proposal.js"></script>
<script src="js/motion.js"></script>
</body>
</html>

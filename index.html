<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">

<!-- LANÇAMENTO: remover a linha abaixo quando houver case real publicado,
     e conferir na URL de produção (não no repo):
       curl -s https://nomadhistory.github.io/ | grep robots
     tem que voltar vazio. -->
<meta name="robots" content="noindex, nofollow">

<title>História Nômade — Marketing studio for hotels, hostels and tourism</title>
<meta name="description" content="Brand, website, automation and paid traffic for small hospitality. A historian finds the story your property is built on; an engineer turns it into direct bookings. Fixed prices — or pay us in nights.">
<link rel="canonical" href="https://nomadhistory.github.io/">

<meta property="og:type" content="website">
<meta property="og:title" content="História Nômade — Marketing studio for hotels, hostels and tourism">
<meta property="og:description" content="Brand, website, automation and paid traffic for small hospitality. Fixed prices — or pay us in nights.">
<meta property="og:url" content="https://nomadhistory.github.io/">
<meta property="og:image" content="https://nomadhistory.github.io/og-image.png">
<meta property="og:locale" content="en">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="História Nômade — Marketing studio for hotels, hostels and tourism">
<meta name="twitter:description" content="Brand, website, automation and paid traffic for small hospitality. Fixed prices — or pay us in nights.">
<meta name="twitter:image" content="https://nomadhistory.github.io/og-image.png">

<meta name="theme-color" content="#12100e">
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<link rel="stylesheet" href="styles-base.css">
<link rel="stylesheet" href="styles-site.css">
<link rel="stylesheet" href="styles-motion.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "História Nômade",
  "description": "Brand identity, websites, automation and paid traffic for hotels, hostels, guesthouses, restaurants and tour operators.",
  "url": "https://nomadhistory.github.io/",
  "areaServed": "Worldwide",
  "knowsLanguage": ["en", "pt"],
  "serviceType": [
    "Brand identity",
    "Website design and development",
    "Marketing automation",
    "Paid traffic management"
  ],
  "audience": {
    "@type": "BusinessAudience",
    "audienceType": "Hotels, hostels, guesthouses, restaurants and tour operators"
  }
}
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- Textura de grão sobre a página inteira. Puramente decorativa. -->
<div class="grain" aria-hidden="true"></div>
<!-- Progresso de leitura, preenchido pelo js/motion.js -->
<div class="scroll-progress" aria-hidden="true"><span></span></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#top" aria-label="História Nômade — home">
      <img src="assets/wordmark.svg" alt="História Nômade" width="180" height="34">
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="#services">Services</a>
      <a href="#packages">Pricing</a>
      <a href="#trade">Pay in nights</a>
      <a class="nav-cta" href="#proposal">Get a proposal</a>
    </nav>
  </div>
</header>

<main id="main">
  <span id="top"></span>

  <section class="hero" id="hero" aria-labelledby="hero-title">
    <div class="hero-aura" aria-hidden="true"></div>
  </section>

  <section class="marquee-band" id="marquee" aria-hidden="true"></section>

  <section class="section" id="services" aria-labelledby="services-title"></section>

  <section class="section section-alt" id="team" aria-labelledby="team-title"></section>

  <!-- Preenchida só quando CONTENT.journey.current existir -->
  <section class="section section-journey" id="journey" hidden></section>

  <section class="section" id="method" aria-labelledby="method-title"></section>

  <section class="section section-alt" id="cases" aria-labelledby="cases-title"></section>

  <section class="section" id="packages" aria-labelledby="packages-title"></section>

  <section class="section section-trade" id="trade" aria-labelledby="trade-title"></section>

  <section class="section" id="proposal" aria-labelledby="proposal-title"></section>

  <section class="section section-alt" id="contact" aria-labelledby="contact-title"></section>
</main>

<footer class="site-footer">
  <div class="wrap" id="footer-inner"></div>
</footer>

<script src="js/content.js"></script>
<script src="js/proposal-engine.js"></script>
<script src="js/site.js"></script>
<script src="js/proposal.js"></script>
<script src="js/motion.js"></script>
</body>
</html>
